name: snapshot
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: snapshot, cancel-in-progress: false}
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/snapshot.py
      - run: |
          git config user.name "kalshi-desk-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet || (git commit -m "snapshot $(date -u +%FT%TZ)" && git pull --rebase && git push)
